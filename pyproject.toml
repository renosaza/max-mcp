[project]
name = "max-mcp"
version = "0.1.0"
description = "Local stdio MCP server exposing MAX messenger (user session) to Claude Code"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp[cli]>=1.28.1,<2",
  "maxapi-python>=2.1.2",
  "pydantic>=2.6",
]

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "cryptography>=50.0.0",
  "msgpack>=1.2.1",
  "pydantic-settings>=2.14.2",
  "starlette>=1.3.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff>=0.14,<0.16",
]

[project.scripts]
max-mcp       = "max_mcp.server:main"
max-mcp-login = "max_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/max_mcp"]
