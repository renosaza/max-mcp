[project]
name = "max-mcp"
version = "0.2.0"
description = "Local stdio MCP server exposing MAX messenger (user session) to Claude Code"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp[cli]>=1.0",
  "maxapi-python==2.4.1",
  "pydantic>=2.6",
]

[project.scripts]
max-mcp       = "max_mcp.server:main"
max-mcp-login = "max_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/max_mcp"]
