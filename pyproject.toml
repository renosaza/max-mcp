[project]
name = "max-mcp"
version = "0.2.0"
description = "Local stdio MCP server exposing MAX messenger (user session) to Codex and Claude Code"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp[cli]>=1.30.0,<2",
  "maxapi-python==2.4.1",
  "aiohttp>=3.14.4,<4",
  "pydantic>=2.6",
]

[tool.uv]
constraint-dependencies = [
  "anyio>=4.14.2",
  "certifi>=2026.10.18",
  "cryptography>=50.0.0",
  "msgpack>=1.2.3",
  "multidict>=6.9.1",
  "pydantic-settings>=2.14.2",
  "pyjwt>=2.15.0",
  "starlette>=1.3.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.17,<0.18",
]

[project.scripts]
max-mcp       = "max_mcp.server:main"
max-mcp-login = "max_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/max_mcp"]
